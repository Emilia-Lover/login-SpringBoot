<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h2>회원가입</h2>
<p th:if="${param.exists}" style="color:red;">이미 존재하는 아이디입니다.</p>
<form th:action="@{/signup}" method="post">
    <div><label>아이디:</label> <input type="text" name="username" required /></div>
    <div><label>비밀번호:</label> <input type="password" name="password" required /></div>
    <button type="submit">가입하기</button>
</form>
<a th:href="@{/login}">로그인으로</a>
</body>
</html>
